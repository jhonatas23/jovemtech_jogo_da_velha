<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250">
<rect width="1800" height="1250" fill="#f4f7fb"/><text x="60" y="58" font-family="Arial" font-size="32" font-weight="bold" fill="#16324f">Modelo lógico — Implementação PostgreSQL</text>
<defs><style>.box{fill:white;stroke:#486581;stroke-width:2}.head{fill:#16324f}.ht{font:bold 18px Arial;fill:white}.tx{font:14px Arial;fill:#243b53}.pk{font:bold 14px Arial;fill:#00856a}.edge{stroke:#829ab1;stroke-width:3;fill:none}</style></defs>
<path class="edge" d="M400 250 H560 V480 H700 M400 600 H560 V520 H700 M400 950 H570 V800 H700 M1100 520 H1260 V300 H1400 M1100 520 H1260 V650 H1400 M1100 850 H1260 V920 H1400"/>
<g transform="translate(60,130)"><rect class="box" width="340" height="250"/><rect class="head" width="340" height="42"/><text class="ht" x="16" y="28">clinica</text><text class="pk" x="16" y="72">PK id_clinica</text><text class="tx" x="16" y="102">cnpj UNIQUE NOT NULL</text><text class="tx" x="16" y="132">razao_social NOT NULL</text><text class="tx" x="16" y="162">nome_fantasia, cnes UNIQUE</text><text class="tx" x="16" y="192">telefone, email, endereco</text></g>
<g transform="translate(60,470)"><rect class="box" width="340" height="250"/><rect class="head" width="340" height="42"/><text class="ht" x="16" y="28">medico</text><text class="pk" x="16" y="72">PK id_medico</text><text class="tx" x="16" y="102">cpf UNIQUE NOT NULL</text><text class="tx" x="16" y="132">crm UNIQUE NOT NULL</text><text class="tx" x="16" y="162">nome NOT NULL</text><text class="tx" x="16" y="192">telefone, email, dt_nascimento</text></g>
<g transform="translate(60,830)"><rect class="box" width="340" height="200"/><rect class="head" width="340" height="42"/><text class="ht" x="16" y="28">especialidade</text><text class="pk" x="16" y="72">PK id_especialidade</text><text class="tx" x="16" y="102">nome UNIQUE NOT NULL</text><text class="tx" x="16" y="132">descricao VARCHAR(255)</text></g>
<g transform="translate(700,350)"><rect class="box" width="400" height="350"/><rect class="head" width="400" height="42"/><text class="ht" x="16" y="28">consulta</text><text class="pk" x="16" y="72">PK id_consulta</text><text class="tx" x="16" y="102">FK id_clinica, id_paciente, id_medico</text><text class="tx" x="16" y="132">data_consulta DATE</text><text class="tx" x="16" y="162">hora_consulta TIME</text><text class="tx" x="16" y="192">status DEFAULT 'agendada'</text><text class="tx" x="16" y="222">observacoes TEXT</text><text class="tx" x="16" y="252">motivo VARCHAR(255)</text><text class="tx" x="16" y="282">valor NUMERIC(10,2)</text><text class="pk" x="16" y="322">UNIQUE (id_medico, data_consulta, hora_consulta)</text></g>
<g transform="translate(700,820)"><rect class="box" width="400" height="200"/><rect class="head" width="400" height="42"/><text class="ht" x="16" y="28">medico_especialidade</text><text class="pk" x="16" y="72">PK composta: id_medico + id_especialidade</text><text class="tx" x="16" y="102">FK id_medico → medico</text><text class="tx" x="16" y="132">FK id_especialidade → especialidade</text></g>
<g transform="translate(1400,210)"><rect class="box" width="340" height="230"/><rect class="head" width="340" height="42"/><text class="ht" x="16" y="28">paciente</text><text class="pk" x="16" y="72">PK id_paciente</text><text class="tx" x="16" y="102">cpf UNIQUE NOT NULL</text><text class="tx" x="16" y="132">nome NOT NULL, dt_nascimento</text><text class="tx" x="16" y="162">telefone, email, endereco, sexo</text></g>
<g transform="translate(1400,590)"><rect class="box" width="340" height="270"/><rect class="head" width="340" height="42"/><text class="ht" x="16" y="28">contrato</text><text class="pk" x="16" y="72">PK id_contrato</text><text class="tx" x="16" y="102">FK id_medico, id_clinica</text><text class="tx" x="16" y="132">numero_contrato UNIQUE NOT NULL</text><text class="tx" x="16" y="162">data_inicio, data_fim</text><text class="tx" x="16" y="192">valor, tipo_contrato, status</text><text class="tx" x="16" y="222">observacoes</text></g>
<text x="60" y="1160" font-family="Arial" font-size="15" fill="#627d98">Modelo lógico atualizado para refletir a estrutura conferida no Supabase em 25/11/2026.</text>
</svg>