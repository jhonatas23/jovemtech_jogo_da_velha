<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1180" viewBox="0 0 1700 1180">
<rect width="1700" height="1180" fill="#f4f7fb"/><text x="70" y="70" font-family="Arial" font-size="34" font-weight="bold" fill="#16324f">Esquema atual do Supabase — public</text><text x="70" y="108" font-family="Arial" font-size="18" fill="#486581">Projeto clinica-agendamento-curso • PostgreSQL 17.12 • 7 tabelas • RLS habilitado</text>
<defs><style>.b{fill:white;stroke:#486581;stroke-width:2}.h{fill:#16324f}.ht{font:bold 18px Arial;fill:white}.t{font:14px Arial;fill:#243b53}.k{font:bold 14px Arial;fill:#00856a}.e{stroke:#829ab1;stroke-width:3;fill:none}</style></defs>
<path class="e" d="M400 280 H620 V470 H760 M400 570 H650 V520 H760 M400 570 H600 V830 H760 M400 870 H620 V900 H760 M1080 470 H1220 V430 H1290 M1080 540 H1220 V770 H1290 M1080 900 H1220 V770 H1290"/>
<g transform="translate(70,180)"><rect class="b" width="330" height="220"/><rect class="h" width="330" height="42"/><text class="ht" x="15" y="28">clinica</text><text class="k" x="15" y="72">PK id_clinica</text><text class="t" x="15" y="102">cnpj UNIQUE NOT NULL</text><text class="t" x="15" y="132">razao_social NOT NULL</text><text class="t" x="15" y="162">nome_fantasia, cnes UNIQUE</text><text class="t" x="15" y="192">2 registros</text></g>
<g transform="translate(70,470)"><rect class="b" width="330" height="220"/><rect class="h" width="330" height="42"/><text class="ht" x="15" y="28">medico</text><text class="k" x="15" y="72">PK id_medico</text><text class="t" x="15" y="102">cpf UNIQUE, crm UNIQUE</text><text class="t" x="15" y="132">nome NOT NULL</text><text class="t" x="15" y="162">telefone, email, dt_nascimento</text><text class="t" x="15" y="192">3 registros</text></g>
<g transform="translate(70,770)"><rect class="b" width="330" height="180"/><rect class="h" width="330" height="42"/><text class="ht" x="15" y="28">especialidade</text><text class="k" x="15" y="72">PK id_especialidade</text><text class="t" x="15" y="102">nome UNIQUE NOT NULL</text><text class="t" x="15" y="132">descricao VARCHAR(255)</text><text class="t" x="15" y="162">4 registros</text></g>
<g transform="translate(760,350)"><rect class="b" width="320" height="300"/><rect class="h" width="320" height="42"/><text class="ht" x="15" y="28">consulta</text><text class="k" x="15" y="72">PK id_consulta</text><text class="t" x="15" y="102">FK id_clinica, id_paciente, id_medico</text><text class="t" x="15" y="132">data DATE, hora TIME</text><text class="t" x="15" y="162">status DEFAULT agendada</text><text class="t" x="15" y="192">observacoes TEXT</text><text class="t" x="15" y="222">motivo VARCHAR(255)</text><text class="t" x="15" y="252">valor NUMERIC(10,2)</text><text class="t" x="15" y="282">UNIQUE médico + data + hora</text></g>
<g transform="translate(760,760)"><rect class="b" width="320" height="190"/><rect class="h" width="320" height="42"/><text class="ht" x="15" y="28">medico_especialidade</text><text class="k" x="15" y="72">PK composta</text><text class="t" x="15" y="102">FK id_medico → medico</text><text class="t" x="15" y="132">FK id_especialidade → especialidade</text><text class="t" x="15" y="162">4 registros</text></g>
<g transform="translate(1290,340)"><rect class="b" width="340" height="230"/><rect class="h" width="340" height="42"/><text class="ht" x="15" y="28">paciente</text><text class="k" x="15" y="72">PK id_paciente</text><text class="t" x="15" y="102">cpf UNIQUE NOT NULL</text><text class="t" x="15" y="132">nome NOT NULL</text><text class="t" x="15" y="162">dt_nascimento, telefone, email</text><text class="t" x="15" y="192">endereco, sexo • 3 registros</text></g>
<g transform="translate(1290,680)"><rect class="b" width="340" height="260"/><rect class="h" width="340" height="42"/><text class="ht" x="15" y="28">contrato</text><text class="k" x="15" y="72">PK id_contrato</text><text class="t" x="15" y="102">FK id_medico, id_clinica</text><text class="t" x="15" y="132">numero_contrato UNIQUE</text><text class="t" x="15" y="162">data_inicio, data_fim</text><text class="t" x="15" y="192">valor, tipo_contrato, status</text><text class="t" x="15" y="222">3 registros</text></g>
<text x="70" y="1090" font-family="Arial" font-size="14" fill="#627d98">Gerado a partir de metadados e contagens consultados diretamente no Supabase em 25/11/2026. Não é captura literal da interface.</text>
</svg>